agents:
  _workorder_agent:
    type: instance
    models: [gemini-2.5-flash]
    params:
      model_id: gemini-2.0-flash-exp
      class: WorkorderAgent
  aggregator_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: aggregator_agent
      description: Aggregator agent to summarize all reports.
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.2"
      instruction: return_aggregator_prompt()
      output_key: final_comprehensive_report
      after_agent_callback: summarize_agent_output_callback
  alarm_research_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    tools: [get_device_model, list_corpora, rag_query_corpus, rag_query_all]
    params:
      name: alarm_research_agent
      description: Vertex AI RAG Agent
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.2"
      instruction: rag_prompt_v7()
      output_key: alarm_agent_output
      before_agent_callback: state_setup
      after_agent_callback: summarize_agent_output_callback
  alarm_researcher:
    type: instance
    params:
      name: alarm_researcher
      description: You are a sequential agent that coordinates the execution of the alarm_research_agent.
      sub_agents: [alarm_research_agent, detailed_inverter_performance_agent]
  chat_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: investigation_qa_assistant
      instruction: [You are a helpful assistant that can answer questions about an ongoing solar plant investigation., 'Investigation
          Context:', '- Investigation ID: {investigation_id}', '- Plant ID: {investigation.plant_id}', '- Analysis Period:
          {investigation.start_date} to {investigation.end_date}', '- Status: {investigation.status.value}', 'You can help
          users understand the investigation results, clarify findings, and answer follow-up questions.', 'Keep your responses
          concise and helpful. If you need more specific data, ask the user to be more specific.', 'Findings from investigation:',
        '{value}']
      description: Assistant for answering questions about solar plant investigations
      function: continue_investigation
  daily_pr_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: daily_pr_agent
      description: You are agent to retrieve daily and monthly PR data for specific plant
      instruction: return_instruction_daily_pr()
      after_agent_callback: summarize_agent_output_callback
      output_key: daily_pr_agent_output
  detailed_inverter_performance_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    tools: [append_problematic_rows]
    params:
      name: detailed_inverter_performance_agent
      instruction: return_instruction_detailed_inverter_performance()
      before_agent_callback: setup
      output_key: detailed_inverter_performance_agent_output
      after_agent_callback: summarize_agent_output_callback
  detailed_plant_timeseries_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    tools: [filter_plant_timeseries_data, append_problematic_rows]
    params:
      name: detailed_plant_timeseries_agent
      description: You are an expert in retrieving detailed data for target days for specific plants
      instruction: return_instruction_detailed_plant_timeseries()
      before_agent_callback: setup
      output_key: detailed_plant_timeseries_agent_output
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.1"
      after_agent_callback: summarize_agent_output_callback
  parallel_pipeline:
    type: instance
    params:
      name: parallel_pipeline
      sub_agents: [detailed_plant_timeseries_agent, alarm_researcher]
  planner_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    tools: [store_inverter_device_id_and_capacity_peak]
    params:
      name: planner_agent
      instruction: return_instruction_planner()
      description: You are an expert planner
      output_key: planner_agent_output
      after_agent_callback: summarize_agent_output_callback
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.1"
  root_agent.0:
    type: instance
    params:
      name: problem_finder
      sub_agents: [planner_agent, daily_pr_agent, parallel_pipeline, aggregator_agent]
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: databasemcp_agent
      instruction: [You are a helpful Model Context Protocol (MCP) agent that retrieves data from database.]
      instance: root_agent
  structured_summarizer_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: structured_summarizer_agent
      description: Agent that creates structured summaries of other agent outputs
      instruction: get_structured_summarizer_prompt()
      output_key: structured_summary
  workorder_agent:
    type: instance
    models: [gemini-2.5-flash-preview-05-20]
    params:
      name: workorder_agent
      instruction: create_workorder_prompt(investigation)
      description: Help users to create workorders based on investigation results
      output_key: workorder_agent_output
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.1"
      function: redirect_to_workorder_agent

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent.1, chat_agent]
  gemini-2.5-flash:
    type: default
    agents: [_workorder_agent]
  gemini-2.5-flash-preview-05-20:
    type: literal
    agents: [planner_agent, detailed_inverter_performance_agent, daily_pr_agent, structured_summarizer_agent, workorder_agent,
      detailed_plant_timeseries_agent, alarm_research_agent, aggregator_agent]

tools:
  append_problematic_rows:
    type: function
    agents: [detailed_inverter_performance_agent, detailed_plant_timeseries_agent]
    params:
      description: |-
        tools to store problematic rows
        parameters
        String rows : the json response for the problematic five minutes data eg. "{problematic_five_minutes_pr : [row_data_here] ,analysis : "A general explaination on why you think these data is abnormal}"
  filter_plant_timeseries_data:
    type: function
    agents: [detailed_plant_timeseries_agent]
    params:
      description: |-
        Tools to filter the data, to extract possible abnormal data for further analysis

        args:
        string_data(str) :data to be filtered in string

        return:
        res(str) :filtered data in json string
  get_device_model:
    type: function
    agents: [alarm_research_agent]
    params:
      description: |-
        Gets the device model from the database based on plant id.

        Args:
            plantID: The unique ID for the target plant
            date: The target time to investigate
            toolContext: Context for updating session state

        Returns:
            dict: Status and result after executing the tool:
                - action: The name of the tool used
                - problematic_device_model: The device model found
                - message: Brief message about the outcome
  list_corpora:
    type: function
    agents: [alarm_research_agent]
    params:
      description: |-
        List all available Vertex AI RAG corpora.

        Args:
            device_model: The target device model stored in ToolContext state `problematic_device_model`
            toolContext: Context for updating session state

        Returns:
            dict: A list of available corpora and status, with each corpus containing:
                - status: The status of executing the tool
                - message: Brief message about tool outcome
                - corpus_name: The resource name of the corpus to be queried in the next step
  rag_query_all:
    type: function
    agents: [alarm_research_agent]
  rag_query_corpus:
    type: function
    agents: [alarm_research_agent]
    params:
      description: |-
        Returns a dict containing the status and information after querying a specific corpus.

        Args:
            query (str): The query to search the corpus.

        Returns:
            A dictionary containing along with the query results from the target corpus.
  store_inverter_device_id_and_capacity_peak:
    type: function
    agents: [planner_agent]
    params:
      description: |-
        Store inverter device id and capacity peak in the tool context state.

        args:
            tool_context (ToolContext): The context of the tool where the state is stored.
            data (dict): A dictionary containing inverter device ids and their corresponding capacity peaks.

mcp:
  ToolboxSyncClient:
    type: toolbox
    url: https://agentmcp.liongkj.com
    params:
      class: ToolboxSyncClient
      method: load_toolset

teams:
